name: Source and native Linux build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install native editor dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libsdl2-dev zlib1g-dev libgl1-mesa-dev libopenxr-dev
          python3 -m pip install -r requirements.txt
      - name: Check source and contributor metadata
        run: python3 tools/check-repo.py --publication
      - name: Test original synthetic suites
        run: |
          python3 tools/test-coverage-ledger.py
          python3 tools/test-dynamic-inventory.py
          python3 tools/test-native-trace.py
          python3 tools/test-coverage-disposition.py
          python3 tools/test-terrain-regions.py
      # No ROM/decomp assets, GPU or headset fixtures are downloaded or uploaded.
      - name: Build the native batch tool
        run: bash tools/build.sh --batch-only --build-dir build-linux --jobs 2
      - name: Run headless native checks
        env:
          RUBYVR_REVIEW_BATCH: ${{ github.workspace }}/build-linux/rubyvr_studio
        run: |
          unset DISPLAY
          bash -n tools/build.sh tools/run-batch.sh tools/run-studio.sh
          file build-linux/rubyvr_studio
          mkdir -p build-linux/terrain-test build-linux/foundation-test
          build-linux/rubyvr_studio --test-terrain build-linux/terrain-test
          build-linux/rubyvr_studio --test-foundation build-linux/foundation-test
          build-linux/rubyvr_studio --test-connected
          bash tools/run-batch.sh --test-connected
          python3 tools/test-coverage-review.py
          python3 tools/test-native-portability.py --build-dir build-linux
          python3 tools/test-bash-launcher.py
      - name: Compile the native GUI without opening a display
        run: |
          cmake -S . -B build-linux -DRUBYVR_BUILD_GUI=ON
          cmake --build build-linux --target rubyvr_gui --parallel 2
      # Real editor/connected rendering checks use local source art on WSLg.
      # No OpenXR runtime or headset acceptance is claimed by this job.
